<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>SplitSmart</title>
<style>
  body { font-family: sans-serif; max-width: 560px; margin: 30px auto; padding: 0 12px; }
  input { padding: 8px; margin: 4px 0; }
  button { padding: 8px 14px; margin: 4px 0; cursor: pointer; }
  .item { border: 1px solid #ccc; border-radius: 6px; padding: 8px; margin: 8px 0; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .person { margin-right: 10px; }
  .result { border-bottom: 1px solid #eee; padding: 8px 0; }
  #scanStatus { color: #555; }
</style>
</head>
<body>
  <h1>SplitSmart</h1>

  <h3>1. Who is at the table?</h3>
  <input id="people" placeholder="Ravi, Priya, Anil" style="width:100%">
  <button onclick="setPeople()">Set people</button>

  <div id="itemsSection" style="display:none">
    <h3>2. Upload a bill photo (or add items by hand)</h3>
    <input type="file" accept="image/*" onclick="this.value=''" onchange="scanBill(this)">
    <p id="scanStatus"></p>

    <div id="items"></div>
    <button onclick="addItem()">+ Add item</button>
    <h3>Rules (optional)</h3>
    <input id="rules" placeholder="e.g. Priya is vegetarian, Ravi did not drink water" style="width:100%">
    <button onclick="applyRules()">Apply rules</button>
    <p id="rulesStatus" style="color:#555"></p>
    <h3>3. Tax + tip total (USD)</h3>
    <input id="extra" type="number" step="0.01" value="0">
    <br>
    <button onclick="calculate()">Calculate split</button>
  </div>

  <div id="results"></div>

<script>
  let people = [];

  function setPeople() {
    const list = document.getElementById('people').value
      .split(',').map(s => s.trim()).filter(Boolean);
    people = [...new Set(list)];
    if (people.length < 2) {
      alert('Enter at least 2 names, separated by commas');
      return;
    }
    document.getElementById('items').innerHTML = '';
    document.getElementById('results').innerHTML = '';
    document.getElementById('scanStatus').textContent = '';
    document.getElementById('itemsSection').style.display = 'block';
    addItem();
  }

  function addItem(prefName, prefPrice) {
    const box = document.createElement('div');
    box.className = 'item';

    const top = document.createElement('div');
    top.className = 'row';

    const n = document.createElement('input');
    n.placeholder = 'Item name';
    n.className = 'iname';
    if (prefName) n.value = prefName;

    const p = document.createElement('input');
    p.type = 'number';
    p.step = '0.01';
    p.placeholder = 'Price';
    p.className = 'iprice';
    p.style.width = '90px';
    if (prefPrice) p.value = prefPrice;

    const rm = document.createElement('button');
    rm.textContent = 'Remove';
    rm.onclick = () => box.remove();

    top.append(n, p, rm);

    const who = document.createElement('div');
    people.forEach(name => {
      const label = document.createElement('label');
      label.className = 'person';
      const cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.value = name;
      cb.checked = true;
      label.append(cb, ' ' + name);
      who.append(label);
    });

    box.append(top, who);
    document.getElementById('items').append(box);
  }

  function resizeImage(file) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      const url = URL.createObjectURL(file);
      img.onload = () => {
        const max = 1600;
        const scale = Math.min(1, max / Math.max(img.width, img.height));
        const c = document.createElement('canvas');
        c.width = Math.round(img.width * scale);
        c.height = Math.round(img.height * scale);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url);
        resolve(c.toDataURL('image/jpeg', 0.85));
      };
      img.onerror = () => reject(new Error('Bad image'));
      img.src = url;
    });
  }

    async function scanBill(input) {
    const file = input.files[0];
    if (!file) return;
    const status = document.getElementById('scanStatus');
    status.textContent = 'Reading bill...';
    try {
      const dataUrl = await resizeImage(file);
      const r = await fetch('/api/read-bill', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ image: dataUrl.split(',')[1] }),
      });
      const data = await r.json();
      if (!r.ok) throw new Error(data.error || 'Failed');

      document.getElementById('items').innerHTML = '';
      document.getElementById('results').innerHTML = '';
      if (data.items.length === 0) {
        addItem();
        status.textContent = 'No items found. Try a clearer photo.';
      } else {
        data.items.forEach(i => addItem(i.name, i.price));
        document.getElementById('extra').value = data.extra.toFixed(2);
        status.textContent = 'Found ' + data.items.length + ' items. Check them and fix any mistakes.';
      }
    } catch (e) {
      status.textContent = 'Could not read the bill. Try a clearer photo.';
    }
    }

  async function applyRules() {
    const rules = document.getElementById('rules').value.trim();
    const status = document.getElementById('rulesStatus');
    if (!rules) {
      status.textContent = 'Type a rule first';
      return;
    }
    const boxes = [...document.querySelectorAll('.item')];
    const items = boxes.map(b => b.querySelector('.iname').value || 'item');
    status.textContent = 'Applying rules...';
    try {
      const r = await fetch('/api/apply-rules', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ people, items, rules }),
      });
      const data = await r.json();
      if (!r.ok) throw new Error(data.error || 'Failed');
      boxes.forEach((box, i) => {
        const who = data.assignments[i] || [];
        box.querySelectorAll('input[type=checkbox]').forEach(cb => {
          cb.checked = who.includes(cb.value);
        });
      });
      status.textContent = 'Rules applied. Check the ticks and fix anything that looks wrong.';
    } catch (e) {
      status.textContent = 'Could not apply rules. Try again.';
    }
  }
  function calculate() {
    const owed = {};
    people.forEach(p => (owed[p] = 0));
    let subtotal = 0;

    for (const box of document.querySelectorAll('.item')) {
      const price = parseFloat(box.querySelector('.iprice').value);
      if (!(price > 0)) continue;
      const who = [...box.querySelectorAll('input[type=checkbox]:checked')].map(c => c.value);
      if (who.length === 0) {
        alert('Pick at least one person for every item');
        return;
      }
      subtotal += price;
      who.forEach(w => (owed[w] += price / who.length));
    }

    if (subtotal <= 0) {
      alert('Add at least one item with a price');
      return;
    }

    const extra = parseFloat(document.getElementById('extra').value) || 0;
    const res = document.getElementById('results');
    res.innerHTML = '';

    const h = document.createElement('h3');
    h.textContent = 'Who pays what (total ' + (subtotal + extra).toFixed(2) + ' USD)';
    res.append(h);

    people.forEach(name => {
      const share = owed[name] + extra * (owed[name] / subtotal);
      const row = document.createElement('div');
      row.className = 'result';

      const text = document.createElement('span');
      text.textContent = name + ': $' + share.toFixed(2) + '  ';
      row.append(text);

      if (share > 0) {
        const btn = document.createElement('button');
        btn.textContent = 'Create payment link';
        btn.onclick = () => makeLink(name, share, row, btn);
        row.append(btn);
      }
      res.append(row);
    });
  }

  async function makeLink(name, amount, row, btn) {
    btn.disabled = true;
    btn.textContent = 'Creating...';
    try {
      const r = await fetch('/api/create-order', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, amount: amount.toFixed(2) }),
      });
      const data = await r.json();
      if (!data.url) throw new Error(data.error || 'Failed');
      const a = document.createElement('a');
      a.href = data.url;
      a.target = '_blank';
      a.textContent = 'Open PayPal payment';
      btn.replaceWith(a);
    } catch (e) {
      btn.disabled = false;
      btn.textContent = 'Try again';
    }
  }
</script>
</body>
</html>
